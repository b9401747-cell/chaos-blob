<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chaos Blob</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫠</text></svg>">
</head>
<body>

  <div class="bg-glow" id="bgGlow"></div>

  <header class="hud">
    <div class="hud-block">
      <span class="hud-label">Score</span>
      <span class="hud-value" id="scoreVal">0</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">Best</span>
      <span class="hud-value" id="bestVal">0</span>
    </div>
    <div class="hud-block combo-block" id="comboBlock">
      <span class="hud-label">Combo</span>
      <span class="hud-value" id="comboVal">x1</span>
    </div>
  </header>

  <div class="controls">
    <button class="icon-btn" id="soundBtn" title="Toggle sound" aria-label="Toggle sound">🔊</button>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
    <button class="icon-btn" id="resetBtn" title="Reset score" aria-label="Reset score">↺</button>
  </div>

  <div class="combo-bar-wrap" id="comboBarWrap">
    <div class="combo-bar" id="comboBar"></div>
  </div>

  <main class="stage" id="stage">
    <div class="blob-shadow" id="blobShadow"></div>
    <div class="blob" id="blob">
      <div class="blob-face" id="blobFace">
        <div class="eyes" id="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="mouth" id="mouth"></div>
      </div>
    </div>
  </main>

  <p class="hint" id="hint">poke it. drag it. fling it. don't stop.</p>

  <div class="toast" id="toast"></div>

  <div class="rainbow-overlay" id="rainbowOverlay" hidden></div>
  <div class="secret-badge" id="secretBadge" hidden>✨ SECRET MODE ✨</div>

  <footer class="footer">
    made with pure chaos · <span id="clickCount">0</span> total pokes
  </footer>

  <canvas id="fx" class="fx-canvas"></canvas>

<script src="script.js"></script>
</body>
</html>
